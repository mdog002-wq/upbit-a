name: 업비트 코인 매집점수 분석 및 메일 발송

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  # 새 작업 시작 시 밀려있던 이전 작업 자동 취소

jobs:
  run-upbit-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 10분이 지나도 안 끝나면 강제 종료

    permissions:
      contents: write

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install pyupbit pandas numpy requests openpyxl tqdm google-genai oracledb redis paramiko tensorflow feedparser
          pip install --no-cache-dir torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: 파이썬 분석 스크립트 실행
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IS_MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python coin_excel_krw.py

      - name: 대시보드 및 AI 데이터 변경사항 통합 커밋 및 푸시
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
    
          # 1. 원격 저장소 최신 내역을 가장 먼저 병합 (--autostash로 미저장 변경사항 임시 보존)
          git pull origin main --rebase --autostash || echo "No rebase needed"
    
          # 2. 파일 변경사항 스테이징
          git add docs/ scan_history.csv cache/ ai_models/ 2>/dev/null || git add .
    
          # 3. 커밋 처리 (변경사항이 있으면 커밋)
          if ! git diff --staged --quiet; then
            git commit -m "🤖 [Bot] Update dashboard, AI models, and tracker data [skip ci]"
          fi
    
          # 4. 푸시
          git push origin main
