name: 업비트 코인 매집점수 분석 및 메일 발송

on:
  workflow_dispatch:
  # 만약 10분마다 자동으로 돌리고 싶다면 아래 주석을 해제하세요
  # schedule:
  #   - cron: '*/10 * * * *'

jobs:
  run-upbit-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # pip 패키지 캐시 활성화

      - name: 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install pyupbit pandas numpy requests openpyxl tqdm websockets google-genai oracledb redis fastapi uvicorn
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: 파이썬 분석 스크립트 실행
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
          ORACLE_DSN: ${{ secrets.ORACLE_DSN }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          TNS_ADMIN: /tmp/wallet
          IS_MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python coin_excel_krw.py

      - name: 대시보드 HTML 및 누적 히스토리 자동 커밋
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 🚀 [수정] docs/ 폴더(대시보드 HTML)를 Git 추적 목록에 포함
          git add docs/ scan_history.csv cache_*.json ai_models/* 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git pull --rebase origin main || true
            git commit -m "Auto: Update dashboard and AI cache [skip ci]"
            git push
          else
            echo "변경사항이 없어 커밋을 스킵합니다."
          fi
