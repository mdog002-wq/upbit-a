name: 업비트 코인 매집점수 분석 및 메일 발송

on:
  workflow_dispatch:
    # 만약 일정 주기마다 자동으로 돌리고 싶다면 아래 주석을 해제하세요
    # schedule:
    #   - cron: '*/10 * * * *'

jobs:
  run-upbit-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # pip 패키지 캐시 활성화

      - name: 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install pyupbit pandas numpy requests openpyxl tqdm google-genai oracledb redis paramiko tensorflow feedparser
          pip install --no-cache-dir torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: 파이썬 분석 스크립트 실행
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IS_MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python coin_excel_krw.py

      - name: 대시보드 및 AI 데이터 변경사항 통합 커밋 및 푸시
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 0. 워크플로우 파일 변경 사항이 커밋에 포함되지 않도록 안전하게 제외
          git checkout .github/workflows/daily_run.yml 2>/dev/null || true
          git reset HEAD .github/workflows/daily_run.yml 2>/dev/null || true
          
          # 1. 원격 저장소의 최신 변경 사항을 먼저 반영 (충돌 방지)
          git pull origin main --rebase || echo "No rebase needed"
          
          # 2. 변경된 모든 파일 스테이징 (대시보드, 히스토리, 캐시, AI 모델 등)
          git add docs/ scan_history.csv cache/ ai_models/ 2>/dev/null || true
          
          # 3. 변경사항이 있을 때만 커밋 및 푸시 수행 (강제 푸시 제거)
          if ! git diff --staged --quiet; then
            git commit -m "🤖 [Bot] Update dashboard, AI models, and tracker data [skip ci]"
            git push origin main
          else
            echo "변경사항이 없어 커밋을 스킵합니다."
          fi
