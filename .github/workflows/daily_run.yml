name: 업비트 우량주 매집 분석 및 데이터 수집

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-upbit-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # AI 라이브러리 설치 시간을 고려하여 타임아웃 20분으로 여유 확보

    permissions:
      contents: write

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        if: steps.check_time.outputs.is_blocked != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 필요 라이브러리 설치 (AI 프레임워크 포함)
        if: steps.check_time.outputs.is_blocked != 'true'
        run: |
          python -m pip install --upgrade pip
          # 일반 경량 패키지 및 AI 필수 유틸 설치
          pip install pyupbit pandas numpy requests telethon openpyxl tqdm google-genai oracledb redis paramiko feedparser websockets pydantic fastdtw
          # AI 프레임워크 설치 (CPU 전용 경량화 버전으로 설치하여 캐시 및 속도 최적화)
          pip install --no-cache-dir torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install tensorflow-cpu || pip install tensorflow

      # 우량주 매집 분석 및 ai_recommend_tracker.json 생성
      - name: 파이썬 매집 분석 스크립트 실행
        if: steps.check_time.outputs.is_blocked != 'true'
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python coin_excel_krw.py

      # 🌐 대시보드(index.html) 및 AI 데이터 확실한 커밋 & 푸시
      - name: 대시보드 및 AI 데이터 커밋 및 푸시
        if: steps.check_time.outputs.is_blocked != 'true'            
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 1. 생성/수정된 모든 파일 대기열 추가
          git add -f docs/ data/ 2>/dev/null || git add .

          # 2. 변경사항이 있을 때만 커밋 후 원격 코드 수신 & 푸시
          if ! git diff --staged --quiet; then
          git commit -m "🤖 [Bot] Update analysis report & tracker data"
          git pull origin main --rebase
          git push origin main
          else
          echo "변경사항이 없어 커밋을 스킬합니다."
          fi

      # 레포1 완료 시 레포2(mdog002-wq/upbit) 실행 트리거 발송
      - name: Trigger Comprehensive Analysis Repository (repo2)
        if: steps.check_time.outputs.is_blocked != 'true' && success()
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            https://api.github.com/repos/mdog002-wq/upbit/dispatches \
            -d '{"event_type": "backend_complete"}'
