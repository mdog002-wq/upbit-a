name: 업비트 코인 매집점수 분석 및 메일 발송

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  # 새 작업 시작 시 밀려있던 이전 작업 자동 취소

jobs:
  run-upbit-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 10분이 지나도 안 끝나면 강제 종료

    permissions:
      contents: write
      actions: write  # Actions 트리거 권한 추가

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install pyupbit pandas numpy requests openpyxl tqdm google-genai oracledb redis paramiko tensorflow feedparser
          pip install --no-cache-dir torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: 파이썬 분석 스크립트 실행
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IS_MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python coin_excel_krw.py

      - name: 대시보드 및 AI 데이터 변경사항 통합 커밋 및 푸시
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 1. 원격 저장소의 최신 변경 사항 반영
          git pull origin main --rebase || echo "No rebase needed"
          
          # 2. 변경된 데이터 스테이징
          git add docs/ scan_history.csv cache/ ai_models/ 2>/dev/null || true
          
          # 3. 변경사항이 있을 때만 커밋 및 푸시
          if ! git diff --staged --quiet; then
            git commit -m "🤖 [Bot] Update dashboard, AI models, and tracker data [skip ci]"
            git push origin main
          else
            echo "변경사항이 없어 커밋을 스킵합니다."
          fi

      # 💡 작업 성공 시 1분(60초) 휴식 후 다음 작업 트리거
      - name: 1분 휴식 후 다음 작업 트리거
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}  # repo 및 actions 권한이 있는 Personal Access Token 필수
        run: |
          echo "작업 완료. 1분간 대기 후 다음 작업을 트리거합니다..."
          sleep 60
          
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/actions/workflows/daily_run.yml/dispatches \
            -f "ref=main"