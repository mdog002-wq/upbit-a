name: 업비트 코인 매집점수 분석 및 메일 발송

on:
  workflow_dispatch:

jobs:
  run-upbit-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬(Python) 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 업비트 스크립트 실행 및 메일 발송
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python coin_excel_krw.py

      - name: 누적 히스토리(CSV) 및 캐시 자동 커밋 & 푸시
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scan_history.csv cache_*.json
          git commit -m "Auto: Update scan history and cache [skip ci]" || exit 0
          git push
