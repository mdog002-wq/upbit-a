name: Upbit Daily Auto Runner

on:
  schedule:
    # 한국 시각(KST) 기준 매일 아침 09:00 실행 (UTC 기준 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # Actions 탭에서 버튼 클릭으로 즉시 수동 실행 허용

jobs:
  run-python-script:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 3.10 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 업비트 스크립트 실행 및 메일 발송
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python coin_excel_krw.py
