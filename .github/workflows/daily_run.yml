- name: Trigger Backend Repository (upbit)
        if: always() # 앞에 오류가 나더라도 실행하여 상태를 확인
        run: |
          echo "🚀 Sending dispatch event to mdog002-wq/upbit..."
          
          RESPONSE=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            https://api.github.com/repos/mdog002-wq/upbit/dispatches \
            -d '{"event_type": "run_backend"}')
          
          echo "HTTP Response Code: ${RESPONSE}"
          echo "Response Body:"
          cat response.txt
          echo ""
          
          if [ "${RESPONSE}" -eq 204 ]; then
            echo "✅ [성공] upbit 레포지토리로 신호 전송 완료 (204 No Content)"
          else
            echo "❌ [실패] 디스패치 전송 실패! 아래 원인을 확인하세요."
            exit 1
          fi
