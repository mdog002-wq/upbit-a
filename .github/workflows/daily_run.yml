name: 업비트 우량주 매집 분석 및 데이터 수집

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run_backend]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-upbit-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Blocked Time Window (02:00 ~ 02:49 KST)
        id: check_time
        run: |
          HOUR=$(TZ="Asia/Seoul" date +%H | tr -d ' ')
          MINUTE=$(TZ="Asia/Seoul" date +%M | tr -d ' ')
          echo "Current KST Time: ${HOUR}:${MINUTE}"
          
          if [ "$HOUR" -eq 2 ] && [ "$MINUTE" -le 49 ]; then
            echo "is_blocked=true" >> $GITHUB_OUTPUT
            echo "Notice: Current time is within restricted window (02:00 ~ 02:49 KST). Skipping workflow execution."
          else
            echo "is_blocked=false" >> $GITHUB_OUTPUT
          fi

      - name: 저장소 코드 불러오기
        if: steps.check_time.outputs.is_blocked != 'true'
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        if: steps.check_time.outputs.is_blocked != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 필요 라이브러리 설치
        if: steps.check_time.outputs.is_blocked != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pyupbit pandas numpy requests openpyxl tqdm google-genai oracledb redis paramiko tensorflow feedparser websockets
          pip install --no-cache-dir torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      # 우량주 매집 분석 및 ai_recommend_tracker.json 생성
      - name: 파이썬 매집 분석 스크립트 실행
        if: steps.check_time.outputs.is_blocked != 'true'
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python coin_excel_krw.py

      - name: 대시보드 및 AI 데이터 커밋 및 푸시
        if: steps.check_time.outputs.is_blocked != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
    
          git pull origin main --rebase --autostash || echo "No rebase needed"
          git add docs/ data/ scan_history.csv cache/ ai_models/ 2>/dev/null || git add .
    
          if ! git diff --staged --quiet; then
            git commit -m "🤖 [Bot] Update analysis report & tracker data [skip ci]"
            git push origin main
          fi

      # 레포1 완료 시 레포2(mdog002-wq/upbit) 실행 트리거 발송
      - name: Trigger Comprehensive Analysis Repository (repo2)
        if: steps.check_time.outputs.is_blocked != 'true' && success()
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            https://api.github.com/repos/mdog002-wq/upbit/dispatches \
            -d '{"event_type": "backend_complete"}'
