 function renderCoins(data) {
 const tbody = document.getElementById('coinTableBody');
 const recContainer = document.getElementById('recommendedCoinsContainer');
 tbody.innerHTML = '';
 recContainer.innerHTML = '';

 data.forEach(item => {
 const badge = item.rec ? `<span class="badge bg-warning text-dark ms-1" style="font-size: 0.7rem;">🎯 AI추천</span>` : '';
 
 // 메인 테이블 행 추가
 const tr = document.createElement('tr');
 tr.innerHTML = `
 <td class="text-center fw-bold text-muted">${item.rank}</td>
 <td class="fw-bold">${item.name} <span class="text-secondary small">(${item.symbol})</span> ${badge}</td>
 <td>${item.price}</td>
 <td class="text-primary fw-bold">${item.score} <span class="text-muted small">(${item.sim})</span></td>
 `;
 tbody.appendChild(tr);

 // AI 추천 종목 우측 패널 추가
 if (item.rec) {
 const recCard = document.createElement('div');
 recCard.className = 'p-2 bg-light border rounded d-flex justify-content-between align-items-center';
 recCard.innerHTML = `
 <div>
 <strong class="text-dark">${item.name}</strong> <small class="text-muted">(${item.symbol})</small>
 </div>
 <div class="text-end">
 <span class="badge bg-primary me-1">${item.score}</span>
 <small class="text-muted">${item.price} KRW</small>
 </div>
 `;
 recContainer.appendChild(recCard);
 }
 });
 }

 function filterCoins() {
 const query = document.getElementById('coinSearchInput').value.toLowerCase().trim();
 const filtered = coinData.filter(item => 
 item.name.toLowerCase().includes(query) || item.symbol.toLowerCase().includes(query)
 );
 renderCoins(filtered);
 }

 document.addEventListener('DOMContentLoaded', () => {
 renderCoins(coinData);
 });
