<!DOCTYPE html>
<html lang="ko">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta http-equiv="refresh" content="240">
 <title>Upbit AI Quantitative Dashboard</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 <style>
 body { background-color: #f8fafc; color: #1e293b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
 .card { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); height: 100%; }
 .news-box { max-height: 220px; overflow-y: auto; }
 .table-scroll-box { max-height: 650px; overflow-y: auto; }
 .report-body h1, .report-body h2, .report-body h3 { font-size: 1rem; font-weight: bold; margin-top: 0.5rem; color: #0f172a; }
 .report-body ul { padding-left: 1.2rem; margin-bottom: 0.5rem; }
 #allCoinsTable tbody tr:hover { background-color: #f1f5f9 !important; transition: background-color 0.15s ease-in-out; }
 .btn-render-link { background-color: #093687; color: white; border: none; font-weight: bold; transition: all 0.2s; }
 .btn-render-link:hover { background-color: #001f5c; color: white; transform: translateY(-1px); }
 </style>
</head>
<body>
 <div id="mainDashboardApp" class="container-fluid my-4 px-4" style="max-width: 1700px;">
 <!-- 상단 헤더 -->
 <div class="card p-3 shadow-sm mb-4">
 <div class="row align-items-center g-3">
 <div class="col-md-4 col-lg-3">
 <a href="https://mdog002-wq.github.io/upbit/" target="_self" rel="noopener noreferrer" class="btn btn-render-link w-100 py-2 shadow-sm d-flex align-items-center justify-content-center gap-2">
 <i class="fa-solid fa-paper-plane"></i>
 <span>Upbit 실시간</span>
 </a>
 </div>
 <div class="col-md-4 col-lg-5 text-center text-md-start">
 <h3 class="fw-bold text-dark mb-0 fs-4"><i class="fa-solid fa-chart-pie text-primary me-2"></i>업비트 AI 분석 대시보드</h3>
 <small class="text-muted" id="lastUpdatedText">최종 업데이트: 2026-08-12 01:33:01 (총 280개 종목 분석 완료)</small>
 </div>
 <div class="col-md-4 col-lg-4">
 <div class="input-group">
 <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
 <input type="text" id="coinSearchInput" class="form-control border-start-0 bg-light" placeholder="종목명 또는 심볼 검색 (예: 비트코인, BTC)..." oninput="filterCoins()">
 </div>
 </div>
 </div>
 </div>

 <!-- 메인 레이아웃 -->
 <div class="row g-4">
 <!-- 좌측 패널: 속보 / 추천 모니터 / AI 리포트 -->
 <div class="col-lg-4">
 <div class="d-flex flex-column gap-3">
 <!-- 1. 실시간 속보 & 공지 -->
 <div class="card p-3 shadow-sm">
 <h6 class="fw-bold text-success mb-3"><i class="fa-solid fa-newspaper me-1"></i> 실시간 속보 및 공지</h6>
 <div id="newsContainer" class="news-box d-flex flex-column gap-2">
 <div class="text-muted small text-center py-3">속보 데이터를 불러오는 중...</div>
 </div>
 </div>


 <!-- 3. AI 분석 리포트 -->
 <div class="card p-3 shadow-sm">
 <h6 class="fw-bold text-primary mb-3"><i class="fa-solid fa-brain me-1"></i> AI 분석 리포트</h6>
 <div id="reportMarkdownContainer" class="report-body text-secondary small bg-light p-3 rounded" style="max-height: 400px; overflow-y: auto; line-height: 1.5;">
 리포트를 불러오는 중...
 </div>

 </thead>
 <tbody>
<!-- COIN_TABLE_BODY_START -->
<tr>
 <td class="text-center fw-bold text-muted">1</td>
 <td class="fw-bold">데이터 분석 대기 중...</td>
 <td>-</td>
 <td>-</td>
</tr>
<!-- COIN_TABLE_BODY_END -->
 </tbody>
 </table>
 </div>
 </div>
 </div>
 </div>
 </div>

 <script>
 document.addEventListener("DOMContentLoaded", function () {
   loadNewsData();
   loadReportMarkdown();
   highlightWarningCoins();
 });

 async function loadNewsData() {
   const newsContainer = document.getElementById("newsContainer");
   try {
     const response = await fetch("news.json?t=" + new Date().getTime());
     if (!response.ok) throw new Error();
     const newsList = await response.json();

     if (!newsList || newsList.length === 0) {
       newsContainer.innerHTML = `<div class="text-muted small text-center py-3">현재 등록된 속보 이슈가 없습니다.</div>`;
       return;
     }

     let html = "";
     newsList.forEach(item => {
       html += `
         <div class="border-bottom pb-2 mb-2">
           <a href="${item.link}" target="_blank" class="text-decoration-none text-dark fw-bold small d-block text-truncate">
             ${item.title}
           </a>
           <span class="text-muted" style="font-size: 0.75rem;">${item.pubDate || ''}</span>
         </div>
       `;
     });
     newsContainer.innerHTML = html;
   } catch (err) {
     newsContainer.innerHTML = `<div class="text-muted small text-center py-3">속보 데이터를 불러올 수 없습니다.</div>`;
   }
 }

 async function loadReportMarkdown() {
   const reportContainer = document.getElementById("reportMarkdownContainer");
   const recContainer = document.getElementById("recommendMonitorContainer");
   try {
     const response = await fetch("latest_report.md?t=" + new Date().getTime());
     if (!response.ok) throw new Error();
     const markdownText = await response.text();
     reportContainer.innerHTML = marked.parse(markdownText);

     // ai_recommend_tracker.json에서 최신 추천 종목 모니터링 데이터 바인딩
     fetchRecommendTracker();
   } catch (err) {
     reportContainer.innerHTML = `<div class="text-muted small py-2">등록된 AI 분석 리포트가 없습니다.</div>`;
   }
 }

 async function fetchRecommendTracker() {
   const recContainer = document.getElementById("recommendMonitorContainer");
   try {
     const res = await fetch("ai_recommend_tracker.json?t=" + new Date().getTime());
     if (!res.ok) throw new Error();
     const history = await res.json();
     if (!history || history.length === 0) {
       recContainer.innerHTML = `<div class="text-muted small text-center py-2">현재 추천 종목이 없습니다.</div>`;
       return;
     }
     
     const lastEntry = history[history.length - 1];
     const recs = lastEntry.recommended_coins || [];

     if (recs.length === 0) {
       recContainer.innerHTML = `<div class="text-muted small text-center py-2">현재 조건에 맞는 추천 종목이 없습니다.</div>`;
       return;
     }

     let html = "";
     recs.forEach(coin => {
       html += `
         <div class="p-2 border rounded bg-light">
           <div class="d-flex justify-content-between align-items-center mb-1">
             <span class="fw-bold text-dark">${coin.name || coin.symbol} <small class="text-muted">(${coin.symbol})</small></span>
             <span class="badge bg-warning text-dark">🎯 추천</span>
           </div>
           <div class="small text-secondary" style="font-size: 0.8rem;">${coin.reason || ''}</div>
         </div>
       `;
     });
     recContainer.innerHTML = html;
   } catch (err) {
     recContainer.innerHTML = `<div class="text-muted small text-center py-2">추천 종목 모니터를 로드할 수 없습니다.</div>`;
   }
 }

 async function highlightWarningCoins() {
   try {
     const response = await fetch("warning_coins.json?t=" + new Date().getTime());
     if (!response.ok) return;
     const data = await response.json();
     const warningList = data.warning_coins || [];
     if (warningList.length === 0) return;

     const warningSymbols = warningList.map(item => item.symbol ? item.symbol.toUpperCase() : "");
     const table = document.getElementById("allCoinsTable");
     if (!table) return;
     const rows = table.getElementsByTagName("tr");

     for (let i = 1; i < rows.length; i++) {
       const tdName = rows[i].getElementsByTagName("td")[1];
       if (tdName) {
         warningSymbols.forEach(symbol => {
           if (symbol && tdName.innerText.includes(`(${symbol})`) && !tdName.innerHTML.includes("⚠️ AI주의")) {
             tdName.innerHTML += ` <span class="badge bg-danger text-white ms-1" style="font-size: 0.7rem;">⚠️ AI주의</span>`;
           }
         });
       }
     }
   } catch (err) {}
 }

 function filterCoins() {
   const input = document.getElementById('coinSearchInput');
   const filter = input.value.toLowerCase();
   const table = document.getElementById('allCoinsTable');
   const trs = table.getElementsByTagName('tr');

   for (let i = 1; i < trs.length; i++) {
     const tdName = trs[i].getElementsByTagName('td')[1];
     if (tdName) {
       const textValue = tdName.textContent || tdName.innerText;
       trs[i].style.display = textValue.toLowerCase().indexOf(filter) > -1 ? "" : "none";
     }
   }
 }
 </script>
</body>
</html>
